<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR & Admin Service Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f4f6f9] min-h-screen text-slate-800 font-sans">

    <!-- Top Navigation Header -->
    <header class="bg-[#d33918] text-white flex justify-between items-center px-4 py-2 shadow-sm">
        
        <!-- Left Section: Logo Image & Title -->
        <div class="flex items-center gap-4">
            <!-- GitHub বা আপনার হোস্টে থাকা আসল লোগো ইমেজ ট্যাগ -->
            <div class="bg-white px-2 py-1 rounded flex items-center justify-center">
                <img src="YOUR_GITHUB_LOGO_URL_HERE.png" alt="MODINA AUTO PARTS" class="h-7 w-auto object-contain" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/about/assets/thumb-logo.png';">
            </div>
            <h1 class="text-sm font-bold tracking-wide">HR & Admin Service Portal</h1>
        </div>

        <!-- Right Section: Action Buttons & Logout -->
        <div class="flex items-center gap-2 text-xs font-semibold">
            <button onclick="switchRole('HR Portal')" class="bg-[#aa2c11] hover:bg-[#8e240e] text-white px-3 py-1.5 rounded flex items-center gap-1.5 transition cursor-pointer">
                <i class="fa-solid fa-user"></i> HR Portal
            </button>
            <button onclick="switchRole('Admin Portal')" class="bg-[#aa2c11] hover:bg-[#8e240e] text-white px-3 py-1.5 rounded flex items-center gap-1.5 transition cursor-pointer">
                <i class="fa-solid fa-shield-halved"></i> Admin Portal
            </button>
            
            <div id="roleBadge" class="bg-[#1e5bb8] text-white px-3 py-1.5 rounded font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-user-gear"></i> <span id="roleText">Manager Mode: (Super Admin)</span>
            </div>

            <!-- Logout Button with Proper Redirect / Action -->
            <button onclick="handleLogout()" class="bg-black hover:bg-slate-900 text-white px-3.5 py-1.5 rounded font-bold transition cursor-pointer ml-1">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex min-h-[calc(100vh-48px)]">
        
        <!-- Sidebar Menu -->
        <aside class="w-60 bg-[#1b1c21] text-slate-300 p-3 flex-shrink-0">
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 px-2">MAIN MENU</div>
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-2.5 bg-[#d33918] text-white px-3 py-2.5 rounded text-xs font-bold">
                    <i class="fa-solid fa-cart-shopping"></i> Material Requisition
                </a>
                
                <div class="pt-1">
                    <button onclick="toggleHrMenu()" class="w-full flex items-center justify-between text-slate-400 hover:text-white px-3 py-2.5 rounded text-xs font-medium hover:bg-zinc-800 transition">
                        <span class="flex items-center gap-2.5">
                            <i class="fa-regular fa-file-lines"></i> HR Form
                        </span>
                        <i class="fa-solid fa-chevron-down text-[10px]" id="hrArrow"></i>
                    </button>
                    <div id="hrSubmenu" class="hidden pl-8 pr-2 py-1 space-y-1 text-[11px]">
                        <a href="#" class="block py-1 text-slate-400 hover:text-white">Leave Form</a>
                        <a href="#" class="block py-1 text-slate-400 hover:text-white">IOM</a>
                    </div>
                </div>

                <a href="#" class="flex items-center gap-2.5 text-slate-400 hover:text-white px-3 py-2.5 rounded text-xs font-medium hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-chart-line"></i> Reports & Analytics
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-5 bg-[#f4f6f9]">
            <div class="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
                
                <!-- Table Header Controls -->
                <div class="border-b border-slate-200 px-4 py-3 bg-white flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div>
                        <h2 class="font-bold text-slate-800 text-xs tracking-wider flex items-center gap-2 uppercase">
                            <i class="fa-solid fa-list-ul text-[#d33918]"></i> REQUISITION TRACKING HISTORY
                        </h2>
                        <p class="text-[11px] text-slate-500 mt-0.5">Manage, track and approve material requisitions across departments</p>
                    </div>

                    <!-- Search and Filters -->
                    <div class="flex items-center gap-2">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search ID, name or item..." class="pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded text-xs w-60 focus:outline-none focus:border-[#d33918]">
                        </div>
                        
                        <select id="statusFilter" onchange="filterTable()" class="bg-slate-50 border border-slate-300 rounded px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-[#d33918]">
                            <option value="All">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>

                        <button onclick="alert('New Request Form')" class="bg-[#d33918] hover:bg-[#b52f13] text-white font-bold px-3 py-1.5 rounded text-xs flex items-center gap-1 transition cursor-pointer">
                            <i class="fa-solid fa-plus"></i> New Request
                        </button>
                    </div>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 uppercase tracking-wider text-[11px]">
                                <th class="p-3 w-20">ID</th>
                                <th class="p-3">DESCRIPTION & PERSONNEL</th>
                                <th class="p-3 text-center w-32">DEPT HEAD</th>
                                <th class="p-3 text-center w-32">HR & ADMIN</th>
                                <th class="p-3 text-center w-36">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100">
                            <!-- JS Dyn Data -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Script Logic -->
    <script>
        // Data Set matching screenshot
        let requisitions = [
            { id: "REQ-540", desc: "N/A", qty: "Pcs", user: "Asif Ahmed Bin Sattar", dept: "HR & Admin", deptStatus: "Pending", hrStatus: "Pending" },
            { id: "REQ-540", desc: "Abs", qty: "1 Pcs", user: "Asif Ahmed Bin Sattar", dept: "HR & Admin", deptStatus: "Pending", hrStatus: "Pending" },
            { id: "REQ-106", desc: "Uniform", qty: "1 Pcs", user: "Md Ibrahim Hossain ( Mahabub )", dept: "Warehouse (Unit-1)", deptStatus: "Approved", hrStatus: "Approved" },
            { id: "REQ-296", desc: "Uniform", qty: "1 Pcs", user: "Siyam Rahman", dept: "Warehouse (Unit-1)", deptStatus: "Approved", hrStatus: "Approved" },
            { id: "REQ-806", desc: "head phone", qty: "1 Pcs", user: "md shakib", dept: "Sales(TVS)", deptStatus: "Pending", hrStatus: "Pending" },
            { id: "REQ-259", desc: "Half Monthly Bazar", qty: "1 Pcs", user: "Asif Ahmed Bin Sattar", dept: "HR & Admin", deptStatus: "Approved", hrStatus: "Approved" },
            { id: "REQ-676", desc: "stapiller", qty: "1 Pcs", user: "md rakibul islam", dept: "Sales(TVS)", deptStatus: "Rejected", hrStatus: "Rejected" },
            { id: "REQ-995", desc: "pin remover", qty: "1 Pcs", user: "Md. Ziaul Karim", dept: "Marketing", deptStatus: "Approved", hrStatus: "Approved" }
        ];

        let currentRole = "Manager Mode: (Super Admin)";

        function renderTable(data = requisitions) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            data.forEach((item, index) => {
                // Badge Logic
                const getBadge = (status) => {
                    if (status === "Approved") return `<span class="bg-emerald-50 text-emerald-600 font-bold px-3 py-1 rounded text-[11px] border border-emerald-200">Approved</span>`;
                    if (status === "Rejected") return `<span class="bg-red-50 text-red-600 font-bold px-3 py-1 rounded text-[11px] border border-red-200">Rejected</span>`;
                    return `<span class="bg-amber-50 text-amber-600 font-bold px-3 py-1 rounded text-[11px] border border-amber-200">Pending</span>`;
                };

                // Action Logic
                let actionHtml = `<button onclick="resetStatus(${index})" class="text-slate-400 hover:text-slate-600 text-[11px] underline cursor-pointer">Reset Status</button>`;

                if (item.deptStatus === "Pending" || item.hrStatus === "Pending") {
                    actionHtml = `
                        <div class="flex items-center justify-center gap-1">
                            <button onclick="approveItem(${index})" class="bg-[#008a52] hover:bg-emerald-700 text-white font-bold px-2.5 py-1 rounded text-[11px] flex items-center gap-1 transition cursor-pointer">
                                <i class="fa-solid fa-check"></i> Approve
                            </button>
                            <button onclick="rejectItem(${index})" class="bg-[#d33918] hover:bg-red-700 text-white font-bold px-2.5 py-1 rounded text-[11px] flex items-center gap-1 transition cursor-pointer">
                                <i class="fa-solid fa-xmark"></i> Reject
                            </button>
                        </div>
                    `;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold text-[#d33918] align-top">${item.id}</td>
                        <td class="p-3 align-top">
                            <div class="font-bold text-slate-800">
                                ${item.desc} <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] font-semibold border border-slate-200 ml-1">${item.qty}</span>
                            </div>
                            <div class="text-[11px] text-slate-500 mt-1 flex items-center gap-1">
                                <span><i class="fa-solid fa-user text-[#d33918] text-[10px]"></i> ${item.user}</span>
                                <span class="text-slate-300 mx-1">|</span>
                                <span>Dept: <strong>${item.dept}</strong></span>
                            </div>
                        </td>
                        <td class="p-3 text-center align-middle">${getBadge(item.deptStatus)}</td>
                        <td class="p-3 text-center align-middle">${getBadge(item.hrStatus)}</td>
                        <td class="p-3 text-center align-middle">${actionHtml}</td>
                    </tr>
                `;
            });
        }

        function approveItem(i) {
            requisitions[i].deptStatus = "Approved";
            requisitions[i].hrStatus = "Approved";
            renderTable();
        }

        function rejectItem(i) {
            requisitions[i].deptStatus = "Rejected";
            requisitions[i].hrStatus = "Rejected";
            renderTable();
        }

        function resetStatus(i) {
            requisitions[i].deptStatus = "Pending";
            requisitions[i].hrStatus = "Pending";
            renderTable();
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const s = document.getElementById('statusFilter').value;

            const filtered = requisitions.filter(item => {
                const matchQ = item.id.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.user.toLowerCase().includes(q);
                const matchS = (s === 'All') || (item.deptStatus === s || item.hrStatus === s);
                return matchQ && matchS;
            });
            renderTable(filtered);
        }

        function switchRole(role) {
            currentRole = role;
            document.getElementById('roleText').innerText = role;
        }

        function toggleHrMenu() {
            document.getElementById('hrSubmenu').classList.toggle('hidden');
            document.getElementById('hrArrow').classList.toggle('rotate-180');
        }

        // Proper Working Logout Logic
        function handleLogout() {
            // ১. সেশন/লোকাল স্টোরেজ ক্লিয়ার
            localStorage.clear();
            sessionStorage.clear();
            
            // ২. লগইন পেজ বা রিডাইরেক্ট ইউআরএল (এখানে আপনার লগইন পেজের লিংক বসাবেন, যেমন: '/login' বা 'login.html')
            window.location.href = "login.html"; 
        }

        renderTable();
    </script>
</body>
</html>
